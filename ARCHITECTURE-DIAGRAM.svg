<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">SPARKServ system architecture</title>
  <desc id="desc">Architecture diagram showing users interacting with a Next.js application, server logic, Supabase services, and external notification and payment-reference systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef5f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a6680"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#17324d}
      .subtitle{font:400 16px Arial,sans-serif;fill:#526b7f}
      .section{font:700 18px Arial,sans-serif;fill:#17324d}
      .label{font:700 16px Arial,sans-serif;fill:#17324d}
      .body{font:400 14px Arial,sans-serif;fill:#405a70}
      .small{font:400 12px Arial,sans-serif;fill:#5d7386}
      .box{stroke-width:2}
      .line{stroke:#4a6680;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dashed{stroke-dasharray:8 7}
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="70" y="65" class="title">SPARKServ system architecture</text>
  <text x="70" y="94" class="subtitle">Next.js 14 · Vercel · Supabase · appliance repair workflow</text>

  <!-- Users -->
  <g filter="url(#shadow)">
    <rect x="70" y="155" width="220" height="220" rx="18" fill="#e8f1ff" stroke="#3973c6" class="box"/>
    <text x="95" y="188" class="section">Users</text>
    <text x="105" y="230" class="label">Customer</text>
    <text x="105" y="270" class="label">Technician</text>
    <text x="105" y="310" class="label">Admin</text>
    <text x="105" y="350" class="label">Super Admin</text>
  </g>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="355" y="115" width="345" height="300" rx="18" fill="#eaf7ee" stroke="#4a9b61" class="box"/>
    <text x="380" y="150" class="section">Next.js App Router · Vercel</text>
    <rect x="385" y="175" width="285" height="55" rx="10" fill="#ffffff" stroke="#a9cdb3"/>
    <text x="405" y="208" class="label">Role-based web UI</text>
    <text x="405" y="226" class="small">Customer · Technician · Admin · Super Admin</text>
    <rect x="385" y="248" width="285" height="50" rx="10" fill="#ffffff" stroke="#a9cdb3"/>
    <text x="405" y="280" class="label">Middleware</text>
    <text x="525" y="280" class="small">session + role protection</text>
    <rect x="385" y="316" width="135" height="68" rx="10" fill="#ffffff" stroke="#a9cdb3"/>
    <text x="405" y="345" class="label">Components</text>
    <text x="405" y="366" class="small">forms · dashboards</text>
    <rect x="535" y="316" width="135" height="68" rx="10" fill="#ffffff" stroke="#a9cdb3"/>
    <text x="555" y="345" class="label">Hooks</text>
    <text x="555" y="366" class="small">realtime state</text>
  </g>

  <!-- Server -->
  <g filter="url(#shadow)">
    <rect x="765" y="115" width="370" height="300" rx="18" fill="#fff6e6" stroke="#c88722" class="box"/>
    <text x="790" y="150" class="section">Server-side application logic</text>
    <rect x="795" y="175" width="310" height="54" rx="10" fill="#ffffff" stroke="#e0bd7b"/>
    <text x="815" y="208" class="label">API route handlers</text>
    <text x="815" y="226" class="small">auth · requests · bookings · payments</text>
    <rect x="795" y="247" width="310" height="54" rx="10" fill="#ffffff" stroke="#e0bd7b"/>
    <text x="815" y="280" class="label">Domain modules</text>
    <text x="815" y="298" class="small">queue · assignment · estimates · geo</text>
    <rect x="795" y="319" width="150" height="65" rx="10" fill="#ffffff" stroke="#e0bd7b"/>
    <text x="815" y="348" class="label">Catalog</text>
    <text x="815" y="368" class="small">issues · brands · fields</text>
    <rect x="960" y="319" width="145" height="65" rx="10" fill="#ffffff" stroke="#e0bd7b"/>
    <text x="980" y="348" class="label">Cron tick</text>
    <text x="980" y="368" class="small">every 5 minutes</text>
  </g>

  <!-- Supabase -->
  <g filter="url(#shadow)">
    <rect x="1195" y="115" width="335" height="590" rx="18" fill="#f4edff" stroke="#8056b3" class="box"/>
    <text x="1220" y="150" class="section">Supabase</text>
    <rect x="1225" y="175" width="275" height="62" rx="10" fill="#ffffff" stroke="#c6a9df"/>
    <text x="1245" y="208" class="label">Auth</text>
    <text x="1245" y="227" class="small">sessions · recovery · roles</text>
    <rect x="1225" y="255" width="275" height="88" rx="10" fill="#ffffff" stroke="#c6a9df"/>
    <text x="1245" y="288" class="label">Postgres</text>
    <text x="1245" y="309" class="small">users · requests · estimates</text>
    <text x="1245" y="327" class="small">bookings · payments · audit trail</text>
    <rect x="1225" y="361" width="275" height="76" rx="10" fill="#ffffff" stroke="#c6a9df"/>
    <text x="1245" y="394" class="label">RLS + database triggers</text>
    <text x="1245" y="416" class="small">workflow and security enforcement</text>
    <rect x="1225" y="455" width="275" height="76" rx="10" fill="#ffffff" stroke="#c6a9df"/>
    <text x="1245" y="488" class="label">SECURITY DEFINER RPCs</text>
    <text x="1245" y="510" class="small">assignment · offers · booking rules</text>
    <rect x="1225" y="549" width="130" height="62" rx="10" fill="#ffffff" stroke="#c6a9df"/>
    <text x="1245" y="582" class="label">Storage</text>
    <text x="1245" y="600" class="small">photos · avatars</text>
    <rect x="1370" y="549" width="130" height="62" rx="10" fill="#ffffff" stroke="#c6a9df"/>
    <text x="1390" y="582" class="label">Realtime</text>
    <text x="1390" y="600" class="small">messages · alerts</text>
  </g>

  <!-- External -->
  <g filter="url(#shadow)">
    <rect x="355" y="520" width="780" height="185" rx="18" fill="#fff0f0" stroke="#b85c5c" class="box"/>
    <text x="380" y="555" class="section">External integrations and scheduled operations</text>
    <rect x="390" y="585" width="210" height="75" rx="10" fill="#ffffff" stroke="#dcaaaa"/>
    <text x="415" y="618" class="label">Browser Push</text>
    <text x="415" y="640" class="small">Web Push / VAPID</text>
    <rect x="635" y="585" width="210" height="75" rx="10" fill="#ffffff" stroke="#dcaaaa"/>
    <text x="660" y="618" class="label">Semaphore SMS</text>
    <text x="660" y="640" class="small">admin test endpoint only</text>
    <rect x="880" y="585" width="210" height="75" rx="10" fill="#ffffff" stroke="#dcaaaa"/>
    <text x="905" y="618" class="label">GCash reference</text>
    <text x="905" y="640" class="small">external payment proof</text>
  </g>

  <!-- Core rule -->
  <g filter="url(#shadow)">
    <rect x="70" y="780" width="1460" height="125" rx="18" fill="#17324d"/>
    <text x="105" y="825" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Core architectural rule</text>
    <text x="105" y="860" font-family="Arial,sans-serif" font-size="17" fill="#d9e8f5">Queue assignment, booking conflicts, estimate approval, payment verification,</text>
    <text x="105" y="885" font-family="Arial,sans-serif" font-size="17" fill="#d9e8f5">and workflow enforcement are decided in Postgres—not in React or browser code.</text>
  </g>

  <!-- Connections -->
  <path d="M290 265 H355" class="line"/>
  <path d="M700 265 H765" class="line"/>
  <path d="M1135 265 H1195" class="line"/>
  <path d="M530 415 V520" class="line"/>
  <path d="M925 415 V520" class="line"/>
  <path d="M1080 350 H1195" class="line dashed"/>
  <path d="M700 350 H755 V455 H1195" class="line dashed"/>
  <path d="M1355 611 V705 H700" class="line dashed"/>
  <text x="302" y="250" class="small">HTTPS</text>
  <text x="710" y="250" class="small">server calls</text>
  <text x="1142" y="250" class="small">typed queries / RPC</text>
  <text x="540" y="468" class="small">notifications</text>
  <text x="935" y="468" class="small">scheduled sweep</text>
  <text x="1090" y="340" class="small">database writes</text>
</svg>
